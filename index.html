/* Layout: a plain album page. Cover on the left, title / transport / tracklist / notes on the right. */
:root {
  --bg: #ffffff;
  --fg: #1c1c1e;

  --line: #e3e3e6;

  color-scheme: light;

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181b; --fg: #ececee; --muted: #9a9aa2; --line: #2d2e33; --accent: #8fabff; --art-bg: #1f2024; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17181b; --fg: #ececee; --muted: #9a9aa2; --line: #2d2e33; --accent: #8fabff; --art-bg: #1f2024; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: 15px; line-height: 1.8;
  padding-block: 18px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
a { color: var(--accent); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 980px; margin: 0 auto; }

.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 32px; }
.top strong { font-weight: 900; font-size: 18px; }
.top span.sub { color: var(--muted); font-size: 13px; }
.top nav { display: flex; gap: 16px; font-size: 14px; flex-wrap: wrap; }
.lang { color: var(--muted); }
.lang button { color: var(--muted); }
.lang button:hover { color: var(--fg); }

.page { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); }

.cover { display: grid; gap: 8px; min-width: 0; }
.cover canvas { display: block; width: 100%; max-width: 100%; aspect-ratio: 1; background: var(--art-bg); }
.cover small { color: var(--muted); font-size: 12px; }

.main { min-width: 0; }
h1 { margin: 0; font-size: clamp(26px, 4.4vw, 36px); line-height: 1.25; font-weight: 900; text-wrap: balance; overflow-wrap: anywhere; }
.by { margin: 2px 0 18px; color: var(--muted); }

.player { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.pb { width: 40px; height: 40px; display: grid; place-items: center; background: var(--fg); color: var(--bg); border-radius: 50%; }
.pb svg { width: 18px; height: 18px; fill: currentColor; }
.player input { width: 100%; min-width: 0; margin: 0; accent-color: var(--accent); cursor: pointer; }
.clock { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); white-space: nowrap; }
.ctl { display: flex; gap: 18px; margin: 8px 0 0; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.ctl button { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.ctl button:hover { color: var(--fg); }
.ctl button[aria-pressed="false"] { text-decoration: line-through; }

.vol { display: flex; align-items: center; gap: 8px; }
.vol input { width: 90px; margin: 0; accent-color: var(--accent); cursor: pointer; }

.tracks { list-style: none; margin: 22px 0 0; padding: 0; }
.row { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; width: 100%; text-align: left; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.row .t { overflow-wrap: anywhere; }
.row .k { color: var(--muted); font-size: 13px; white-space: nowrap; }
.row:hover .t { text-decoration: underline; text-underline-offset: 3px; }
.row[aria-current="true"] .t { font-weight: 700; color: var(--accent); }
.row[aria-current="true"] .n { color: var(--accent); }
@media (max-width: 460px) { .row { grid-template-columns: 26px minmax(0, 1fr); } .row .k { display: none; } }

.notes { margin-top: 30px; max-width: 62ch; }
.notes h2 { margin: 0 0 6px; font-size: 18px; font-weight: 900; }
.notes p { margin: 0 0 12px; }
.notes .tags { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.notes .arch { font-size: 14px; padding: 10px 14px; background: var(--art-bg); margin: 16px 0; overflow-wrap: anywhere; }
.notes dl { margin: 16px 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 18px; font-size: 14px; }
.notes dt { font-weight: 900; font-variant-numeric: tabular-nums; }
.notes dd { margin: 0; color: var(--muted); }
.notes .caveat { font-size: 13px; color: var(--muted); }
.notes .go { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 16px; }

.foot { margin-top: 56px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

</style>

        var lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 5500;
        var dl = ac.createDelay(1); dl.delayTime.value = 0.33;
        var fb = ac.createGain(); fb.gain.value = 0.28; var wet = ac.createGain(); wet.gain.value = 0.22;
        bus.connect(lp); lp.connect(master);
        lp.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(master);
        master.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.1), ac.sampleRate);
        var d = noiseBuf.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (ac.state === "suspended") ac.resume();
      audioLevel();
    } catch (e) {}
  }
  function audioTune() { if (ac && timer) { seqStep = 0; nextT = ac.currentTime + 0.08; } }
  function audioLevel() {
    if (!ac || !master) return;
    try {
      var on = playing && soundOn;
      master.gain.setTargetAtTime(on ? vol * 0.55 : 0, ac.currentTime, 0.2);
      if (on) seqStart(); else seqStop();
    } catch (e) {}
  }

  /* ---------- UI ---------- */
  var list = $("list");
  TRACKS.forEach(function (t, i) {
    var li = document.createElement("li");
    li.innerHTML = '<button class="row" data-i="' + i + '"><span class="n"></span><span class="t">' + esc(t.title) + '</span><span class="k"></span></button>';
    list.appendChild(li);
  });
  list.addEventListener("click", function (e) { var b = e.target.closest(".row"); if (b) select(+b.dataset.i, true); });

  function extra(t, L) {
    if (t.extra === "sda") {
      return '<p class="arch">Q / K / V → Delta State F + KV Archive → confidence gate → Output</p>' +
        '<dl><dt>0.4721</dt><dd>Measured MSE · SDA-5 / synthetic exact-key recall</dd><dt>0.9336</dt><dd>Measured MSE · untrained KDA-style proxy</dd><dt>16 seeds</dt><dd>Experimental repetition · reported synthetic study</dd></dl>' +
        '<p class="caveat">' + esc(L.caveat) + '</p>';
    }
    if (t.extra === "about") {
      return '<dl>' + L.pillars.map(function (p, i) { var s = p.split(" — "); return '<dt>0' + (i + 1) + '</dt><dd><b>' + esc(s[0]) + '</b> — ' + esc(s[1]) + '</dd>'; }).join("") + '</dl>';
    }
    return "";
  }

  function render() {
    var t = TRACKS[cur], L = t.t[lang], S = UI[lang];
    $("title").textContent = t.title; $("sub").textContent = L.sub; $("kind").textContent = t.kind;
    document.title = (playing ? "▶ " : "") + t.title + " — summer Player";
    document.querySelectorAll(".row").forEach(function (b) {
      var i = +b.dataset.i, on = i === cur;
      b.setAttribute("aria-current", on ? "true" : "false");
      b.querySelector(".n").textContent = on && playing ? "▶" : String(i + 1).padStart(2, "0");
      b.querySelector(".k").textContent = TRACKS[i].t[lang].short;
    });
    $("notes").innerHTML = '<h2>' + esc(t.title) + '</h2>' + (t.tags ? '<p class="tags">' + esc(t.tags) + '</p>' : '') +
      L.body.map(function (b) { return '<p>' + esc(b) + '</p>'; }).join("") + extra(t, L) +
      '<div class="go">' + t.links.map(function (l) { return '<a href="' + l[1] + '" target="_blank" rel="noopener">' + esc(l[0]) + '</a>'; }).join("") + '</div>';
    $("ico").innerHTML = playing ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    $("play").setAttribute("aria-label", playing ? S.pause : S.play);
    $("volLabel").textContent = S.vol; $("prev").textContent = S.prev; $("next").textContent = S.next;
    $("snd").textContent = soundOn ? S.sndOn : S.sndOff; $("hint").textContent = S.hint;
    $("seek").setAttribute("aria-label", S.seek); cv.setAttribute("aria-label", S.cv);
    $("l-ja").setAttribute("aria-pressed", String(lang === "ja")); $("l-en").setAttribute("aria-pressed", String(lang === "en"));
    document.documentElement.lang = lang;
    $("cur").textContent = fmt(pos); $("dur").textContent = fmt(DUR);
    $("seek").value = Math.round(pos / DUR * 1000);
    dirty = true;
  }

  function select(i, autoplay) {
    cur = (i + TRACKS.length) % TRACKS.length; pos = 0; phase = 0;
    try { history.replaceState(null, "", "#" + TRACKS[cur].id); } catch (e) {}
    if (autoplay) setPlaying(true);
    audioTune(); render();
  }
  function setPlaying(v) { playing = v; if (v) audioStart(); audioLevel(); last = 0; render(); }

  document.querySelectorAll(".lang button").forEach(function (b) {
    b.addEventListener("click", function () {
      lang = b.dataset.l;
      try { localStorage.setItem("lang", lang); } catch (e) {}
      render();
    });
  });
  $("play").addEventListener("click", function () { setPlaying(!playing); });
  $("vol").addEventListener("input", function () { vol = this.value / 100; audioLevel(); });
  $("prev").addEventListener("click", function () { if (pos > 4) { pos = 0; render(); } else select(cur - 1, playing); });
  $("next").addEventListener("click", function () { select(cur + 1, playing); });
  $("snd").addEventListener("click", function () { soundOn = !soundOn; this.setAttribute("aria-pressed", String(soundOn)); audioLevel(); render(); });
  $("seek").addEventListener("input", function () { pos = this.value / 1000 * DUR; $("cur").textContent = fmt(pos); dirty = true; });
  document.addEventListener("keydown", function (e) {
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "a" || tag === "button" || e.metaKey || e.ctrlKey) return;
    if (e.code === "Space") { e.preventDefault(); setPlaying(!playing); }
    else if (e.key === "ArrowRight") select(cur + 1, playing);
    else if (e.key === "ArrowLeft") select(cur - 1, playing);
  });

  try { window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { readColors(); dirty = true; }); } catch (e) {}
  new MutationObserver(function () { readColors(); dirty = true; }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  function frame(ts) {
    if (playing) {
      if (last) {
        var dt = Math.min(0.1, (ts - last) / 1000);
        pos += dt; phase += dt;
        if (pos >= DUR) { select(cur + 1, true); last = 0; requestAnimationFrame(frame); return; }
        $("cur").textContent = fmt(pos);
        if (document.activeElement !== $("seek")) $("seek").value = Math.round(pos / DUR * 1000);
      }
      last = ts; dirty = true;
    }
    if (dirty) { draw(); dirty = false; }
    requestAnimationFrame(frame);
  }

  var h = (location.hash || "").slice(1);
  for (var k = 0; k < TRACKS.length; k++) if (TRACKS[k].id === h) cur = k;
  readColors(); render();
  requestAnimationFrame(frame);
})();
</script>

</body></html>
